services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: bc_dba_test
      MYSQL_USER: bc_dba_test
      MYSQL_PASSWORD: ${DB_TEST_PASSWORD:?Set a random disposable test password}
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-33384}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h127.0.0.1 -u$$MYSQL_USER --silent"]
      interval: 3s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/mysql
