name: Checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
      - run: node scripts/run-tests.mjs
      - run: node --test tests/integration-snapshot.mjs
      - run: node tests/frontend-artifact.mjs
      - run: node scripts/stage-frontend.mjs
      - run: node tests/backend-artifact.mjs
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: barangay_connect_test
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: 'base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: barangay_connect_test
      DB_USERNAME: root
      DB_PASSWORD: ephemeral-ci-only
      MYSQL_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit --locked --no-interaction
      - run: php artisan test --compact --display-warnings --fail-on-warning
      - run: vendor/bin/pint --test
  combined:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bc_dba_p1_compat
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: 'base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bc_dba_p1_compat
      DB_USERNAME: root
      DB_PASSWORD: ephemeral-ci-only
      DB_TEST_DISPOSABLE: '1'
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: bc_dba_p1_compat
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: ephemeral-ci-only
      MYSQL_TEST_BIN: /usr/bin
      MYSQL_INTEGRATION: '1'
      P1_COMBINED_TESTS: '1'
      SMS_ENABLED: 'false'
      MAKE_ENABLED: 'false'
      P2_MODULES_ENABLED: 'false'
      OUTBOX_DISPATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Verify MySQL backup clients
        run: |
          command -v mysql
          command -v mysqldump
          mysql --version
      - run: node scripts/prepare-integration.mjs
      - name: Install shared locked test runtime in private snapshot
        working-directory: ${{ env.SNAPSHOT_DIR }}/backend
        run: |
          cp .env.example .env
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked --no-interaction
      - name: P1 and unchanged DBA suites on genuine MySQL
        working-directory: ${{ env.SNAPSHOT_DIR }}/backend
        run: php vendor/phpunit/phpunit/phpunit -c phpunit.combined.xml --display-warnings --fail-on-warning --log-junit combined-junit.xml
      - name: Unchanged P2 contract suite
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}
        run: php backend/tests/P2/run.php
      - name: P2 adapters through shared transport and original frontend gates
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}
        run: |
          node --experimental-vm-modules --experimental-default-type=module --test tests/p2-adapters.mjs tests/p2-foundation-adapters.mjs tests/p2-form-intents.mjs tests/p2-report-forms.mjs tests/p2-official-forms.mjs tests/p2-location-forms.mjs
          node scripts/run-tests.mjs
          node --experimental-default-type=module tests/operational-registration.mjs
          node scripts/check.mjs
          node tests/frontend-artifact.mjs
          node tests/backend-artifact.mjs
          node scripts/stage-backend-frontend.mjs
          node --experimental-default-type=module tests/backend-live.mjs
      - name: Read-only format check of all owners
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}/backend
        run: vendor/bin/pint --test
      - name: Original identity UI on real browser cookies and DBA rows
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}
        run: |
          BROWSER_RUNTIME="$RUNNER_TEMP/bc-browser-runtime"
          mkdir -p "$BROWSER_RUNTIME"
          cp tests/browser/package.json tests/browser/package-lock.json "$BROWSER_RUNTIME/"
          npm ci --prefix "$BROWSER_RUNTIME" --ignore-scripts --no-fund
          npm audit --prefix "$BROWSER_RUNTIME" --omit=optional
          node "$BROWSER_RUNTIME/node_modules/playwright/cli.js" install --with-deps chromium
          P1_BROWSER_MODULE="$BROWSER_RUNTIME/node_modules/playwright/index.mjs" node tests/browser/identity.mjs
      - name: Identity browser evidence
        if: ${{ always() && env.SNAPSHOT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: p1-identity-browser
          path: ${{ env.SNAPSHOT_DIR }}/tests/browser/evidence
          if-no-files-found: ignore
      - name: Cross-owner shared writer and handler acceptance
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}/backend
        run: P2_TEST_BINDINGS=true IDENTITY_ENABLED=true DBA_TEST_AUTOLOAD="$PWD/vendor/autoload.php" php tests/Compatibility/check-shared-contracts.php
      - name: Unchanged P2 production SQL HTTP and race suites
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}
        run: |
          php backend/tests/Support/prepare-p2-database.php p2_test_integration
          DB_DATABASE=p2_test_integration DB_TEST_DATABASE=p2_test_integration php backend/artisan migrate --force --no-interaction
          DB_DATABASE=p2_test_integration DB_TEST_DATABASE=p2_test_integration IDENTITY_ENABLED=true P2_TEST_BINDINGS=true php backend/tests/P2/sql.php
      - name: DBA unchanged actual-service lock review
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}
        run: DB_DATABASE=p2_test_integration DB_TEST_DATABASE=p2_test_integration IDENTITY_ENABLED=true P2_TEST_BINDINGS=true php backend/tests/Review/p2-lock-order.php
      - name: Original operational pages on actual browser sessions and MySQL
        if: ${{ !cancelled() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}
        run: P1_BROWSER_MODULE="$RUNNER_TEMP/bc-browser-runtime/node_modules/playwright/index.mjs" node tests/browser/operations.mjs
      - name: Operational browser evidence
        if: ${{ always() && env.SNAPSHOT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: p1-operational-browser
          path: ${{ env.SNAPSHOT_DIR }}/tests/browser/evidence/operations
          if-no-files-found: ignore
      - name: Verify owner source preservation
        if: ${{ always() && env.SNAPSHOT_DIR != '' }}
        working-directory: ${{ env.SNAPSHOT_DIR }}
        run: node scripts/verify-integration.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, backend, combined]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: node scripts/stage-frontend.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .frontend-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
